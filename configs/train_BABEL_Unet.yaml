# specify your checkpoint in 'weights'
# prepare your data according to the readme

work_dir: ./work_dir/BABEL_Unet/
model_saved_name: ./work_dir/BABEL_Unet/

# feeder
feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: ./dataset/train.pkl
  debug: False
  random_choose: False
  random_shift: False
  random_move: False
  window_size: -1
  nb_class: 4

test_feeder_args:
  data_path: ./dataset/val.pkl
  nb_class: 4

# model
model: model.agcn_Unet.Model
model_args:
  num_class: 4  
  num_person: 1 
  num_point: 25
  graph: graph.ntu_rgb_d.Graph
  graph_args:
    labeling_mode: 'spatial'

#optim
weight_decay: 0.0001
base_lr: 0.0001
step: [30,35]

# training
device: [0]
optimizer: 'Adam'
loss: 'CE'
batch_size: 8
test_batch_size: 1
num_epoch: 40
nesterov: True
lambda_mil: 1.0
weights: ./pretrained/checkpoint.pt  



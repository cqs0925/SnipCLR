work_dir: work_dir/ntu60_cs/skeletonclr_joint/pretext_babel_dense

# feeder
train_feeder: feeder.ntu_feeder.Feeder_triple_BABEL
train_feeder_args:
  data_path: /scratch/b5au/qiushuocheng.b5au/SnipCLR/RVTCLR/datasets/train_split1.pkl
  label_path: /disk1/RVTCLR/data/NTU-RGB-D/xsub/train_label.pkl
  shear_amplitude: 0.5
  temperal_padding_ratio: 6
  aug_method: '345'
  mmap: True

# model
model: net.skeletonclr_dense.SkeletonCLR
model_args:
  base_encoder: net.st_gcn_dense.Model2
  pretrain: True
  feature_dim: 128
  queue_size: 32768
  momentum: 0.999
  Temperature: 0.07
  mlp: True
  in_channels: 3
  hidden_channels: 16 # 1/4 x channels of standard stgcn
  hidden_dim: 256
  num_class: 60
  dropout: 0.5
  graph_args:
    layout: 'ntu-rgb+d'
    strategy: 'spatial'
  edge_importance_weighting: True

# optim
nesterov: False
weight_decay: 1e-4
base_lr: 0.1
optimizer: SGD
step: [550]


# training
device: [0]
batch_size: 128
test_batch_size: 128
num_epoch: 600 
start_epoch: 0
stream: 'joint'

## nearest neighbor mining
topk: 1
mining_epoch: 200

# log
save_interval: 100
eval_interval: -1



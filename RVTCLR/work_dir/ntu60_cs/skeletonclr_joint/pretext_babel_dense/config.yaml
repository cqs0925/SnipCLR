# command line: main.py pretrain_skeletonclr_dense --config ./config/pretext_skeletonclr_babel_dense.yaml

base_lr: 0.1
batch_size: 128
config: ./config/pretext_skeletonclr_babel_dense.yaml
debug: false
device:
- 0
eval_interval: -1
ignore_weights: []
log_interval: 100
mining_epoch: 200
model: net.skeletonclr_dense.SkeletonCLR
model_args:
    Temperature: 0.07
    base_encoder: net.st_gcn_dense.Model2
    dropout: 0.5
    edge_importance_weighting: true
    feature_dim: 128
    graph_args:
        layout: ntu-rgb+d
        strategy: spatial
    hidden_channels: 16
    hidden_dim: 256
    in_channels: 3
    mlp: true
    momentum: 0.999
    num_class: 60
    pretrain: true
    queue_size: 32768
nesterov: false
num_epoch: 600
num_worker: 4
optimizer: SGD
pavi_log: false
phase: train
print_log: true
save_interval: 100
save_log: true
save_result: true
start_epoch: 0
step:
- 550
stream: joint
test_batch_size: 128
test_feeder: feeder.feeder
test_feeder_args: {}
topk: 1
train_feeder: feeder.ntu_feeder.Feeder_triple_BABEL
train_feeder_args:
    aug_method: '345'
    data_path: /scratch/b5au/qiushuocheng.b5au/SnipCLR/RVTCLR/datasets/train_split1.pkl
    label_path: /disk1/RVTCLR/data/NTU-RGB-D/xsub/train_label.pkl
    mmap: true
    shear_amplitude: 0.5
    temperal_padding_ratio: 6
use_gpu: true
weight_decay: 0.0001
weights: null
work_dir: work_dir/ntu60_cs/skeletonclr_joint/pretext_babel_dense
